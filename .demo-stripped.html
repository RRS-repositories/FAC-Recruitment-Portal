const scoreApplicant = (questions, answers) => {
  let total = 0,
    max = 0;
  questions.forEach(q => {
    const best = Math.max(...q.options.map(o => o.score));
    max += best;
    const ans = answers[q.id];
    if (ans !== undefined) {
      if (q.multi && Array.isArray(ans)) {
        ans.forEach(a => {
          if (q.options[a]) total += q.options[a].score;
        });
        max += (ans.length - 1) * best;
      } else if (q.options[ans]) total += q.options[ans].score;
    }
  });
  return max > 0 ? Math.round(total / max * 100) : 0;
};

const AI_PHRASES = ["in today's fast-paced", "i am writing to express", "leverage my", "delve", "furthermore,", "moreover,", "in conclusion,", "a testament to", "i am confident that my", "align with your", "utilize", "synergy", "meticulous attention to detail", "fostering", "robust", "navigate the complexities", "dynamic environment", "honed my", "passion for excellence", "i believe i would be a valuable asset"];
const detectAI = (written, telemetry) => {
  const reasons = [];
  let score = 0;
  const text = Object.values(written || {}).join("\n");
  const chars = text.length;
  const t = telemetry || {};
  if (t.pasteChars > 80) {
    score += 45;
    reasons.push(`Pasted ${t.pasteChars} characters into answer boxes`);
  }
  if (t.typedChars > 0 && t.activeSecs > 0) {
    const cps = t.typedChars / t.activeSecs;
    if (cps > 9) {
      score += 30;
      reasons.push(`Typing speed ${cps.toFixed(1)} chars/sec (implausible)`);
    }
  }
  if (chars > 300 && t.writtenSecs > 0 && t.writtenSecs < 60) {
    score += 25;
    reasons.push(`${chars} characters written in ${t.writtenSecs}s`);
  }
  const hits = AI_PHRASES.filter(ph => text.toLowerCase().includes(ph));
  if (hits.length >= 2) {
    score += Math.min(30, hits.length * 10);
    reasons.push(`AI-style phrasing: "${hits.slice(0, 3).join('", "')}"`);
  }
  const emDash = (text.match(/—/g) || []).length;
  if (emDash >= 3) {
    score += 10;
    reasons.push(`${emDash} em dashes`);
  }
  if (t.tabSwitches >= 4) {
    score += 15;
    reasons.push(`Left the page ${t.tabSwitches} times while writing`);
  }
  score = Math.min(100, score);
  const level = score >= 60 ? "ai_used" : score >= 30 ? "possible" : "clean";
  return {
    level,
    score,
    reasons
  };
};
